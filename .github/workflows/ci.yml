name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy denser

      - name: Tests
        run: pytest -v --cov=denser --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ""  # tests use mock backend; no API calls

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "denser/__init__.py" in names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          assert any(
              name.endswith(".dist-info/licenses/THIRD_PARTY_NOTICES.md") for name in names
          )
          PY

      - name: Install wheel and run offline smoke test
        run: |
          python -m venv /tmp/denser-package-smoke
          /tmp/denser-package-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/denser-package-smoke/bin/denser --version
          /tmp/denser-package-smoke/bin/denser inspect \
            --type skill \
            --min-tokens 1 \
            "$GITHUB_WORKSPACE/denser/skills/denser-compress/SKILL.md" >/dev/null
